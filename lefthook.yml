pre-commit:
  jobs:
    - name: format
      glob:
        - "*.{cjs,cts,js,jsx,mjs,mts,ts,tsx}"
        - "*.{json,json5,jsonc}"
        - "*.{css,less,scss}"
        - "*.{md,mdx}"
        - "*.{yaml,yml}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
